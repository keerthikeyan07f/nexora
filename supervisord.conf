[supervisord]
nodaemon=true
user=root

[program:apache2]
command=apache2ctl -D FOREGROUND
autostart=true
autorestart=true
stderr_logfile=/var/log/apache2_err.log
stdout_logfile=/var/log/apache2_out.log

[program:flask_ml_api]
directory=/var/www/html/python_ml
command=/opt/venv/bin/gunicorn --bind 0.0.0.0:5000 --workers 2 --timeout 120 app:app
autostart=true
autorestart=true
stderr_logfile=/var/log/flask_err.log
stdout_logfile=/var/log/flask_out.log
